[package]
name = "native"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
glyphon = "0.12.0"
pollster = "1.0.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
vt100 = "0.16.2"
wgpu = "30.0.1"
winit = "0.30.13"
